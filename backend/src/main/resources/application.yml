server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: clipsync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clipsync}
    username: ${DB_USERNAME:clipsync}
    password: ${DB_PASSWORD:clipsync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

clipsync:
  # Rooms live for 24 hours. Accepts ISO-8601 durations.
  room-ttl: ${ROOM_TTL:PT24H}
  cleanup-interval: ${CLEANUP_INTERVAL:PT10M}
  cleanup-initial-delay: ${CLEANUP_INITIAL_DELAY:PT5M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.clipsync: INFO
