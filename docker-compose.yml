services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipsync}
      POSTGRES_USER: ${POSTGRES_USER:-clipsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipsync}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - clipsync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipsync} -d ${POSTGRES_DB:-clipsync}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clipsync-pgdata:
